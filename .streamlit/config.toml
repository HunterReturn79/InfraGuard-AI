[theme]
primaryColor = "#00f2fe"
backgroundColor = "#080d1a"
secondaryBackgroundColor = "#0f172a"
textColor = "#f8fafc"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
# A managed runtime has no interactive browser session.  Running headlessly
# keeps the Streamlit server alive for the platform health check.
headless = true
port = 8501
